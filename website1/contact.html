    <body>
        <h1>Activate: Canada's Arcade</h1>
         <p>
            <a href = "index.html">Home</a>
            <a href = "games.html">Games</a>

        <h2>Contact</h2>
        <p>you can contact any of our breanches nearby for support by filling this form</p>
        <!--forms start here-->

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="fname" placeholder="Spongebob" required>
            
            <label for="lastname">Last name:</label>
            <input type="text" id="lastname" name="lastname" placeholder="Squarepants" required>

            <input type="submit">
            <input type="reset">

            <br>
            <br>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" maxlength="12" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="spants@gmail.com">

            <label for="telephone">Telephone:</label>
            <input type="tel" id="telephone" name="telephone" placeholder="(123)-456-7890">

            <label for="date">Date:</label>
            <input type="date" id="date" name="date">

            <label for="number">How many players?:</label>
            <input type="number" id="number" name="number" min="1" max="6">
            
            
        </form>
    </body>
</html>
